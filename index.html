<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side Projects</title>
<style>
:root{--bg:#F5F7F5;--fg:#1B2320;--muted:#5E6A64;--accent:#0F6E56;--line:#D7DDD8}
@media (prefers-color-scheme: dark){:root{--bg:#101512;--fg:#E6EBE7;--muted:#99A49E;--accent:#5CC89F;--line:#2A342E;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 "Source Sans 3","Helvetica Neue",Arial,system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding-block:48px;padding-inline:16px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-size:28px;margin:6px 0 20px}
ul{list-style:none;padding:0;margin:0;border-top:1px solid var(--line)}
li{padding:14px 0;border-bottom:1px solid var(--line)}
a{color:var(--accent);font-weight:600;text-decoration:none}a:hover{text-decoration:underline}
p{margin:4px 0 0;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">HATCH VENTURES · HODGE HQ</div>
  <h1>Side projects</h1>
  <ul>
    <li><a href="giving-platform-options/">Giving platform options</a><p>Star-rated comparison of four giving, CRM and payment setups for The 1996, the Housing Corporation and the Alumni Association.</p></li>
  </ul>
</div>
</body>
</html>
